version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: suffat_db
    environment:
      POSTGRES_USER: suffat_admin
      POSTGRES_PASSWORD: suffat_password
      POSTGRES_DB: suffat_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

  ai-swarm-mcp:
    build:
      context: ./apps/ai-swarm-mcp
      dockerfile: Dockerfile
    container_name: suffat-ai-mcp-server
    ports:
      - "8080:8080"
    volumes:
      - ./volumes/chromadb_data:/app/volumes/chromadb_data
      - ./apps/internal-erp:/workspace/internal-erp:ro
      - ./apps/mobile-portal:/workspace/mobile-portal:ro
    environment:
      - CHROMA_PERSIST_DIR=/app/volumes/chromadb_data
    restart: unless-stopped

