# Location: apps/production-ops/configs/logrotate.conf
# Enforce hourly rotation for high-frequency multi-tenant API logs
/var/log/suffat-erp/*.log {
    hourly
    rotate 168                      # Retain exactly 7 days of logs (24 * 7)
    maxsize 50M                     # Rotate immediately if log exceeds 50 Megabytes
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        # Gracefully signal system log daemons to flush buffers
        /usr/bin/killall -HUP syslogd 2>/dev/null || true
    endscript
}
