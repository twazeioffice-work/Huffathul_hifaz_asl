; Location: apps/production-sre/pgbouncer/pgbouncer.ini

[databases]
suffat_prod = host=suffat-prod-db-instance port=5432 dbname=suffat_db_prod

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

listen_addr = *
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Core Pooling Parameters
pool_mode = transaction     ; High-concurrency transaction pooling
max_client_conn = 10000     ; Scale to handle up to 10k parallel active clients
default_pool_size = 50      ; Max persistent database connections per branch pool
reserve_pool_size = 10
reserve_pool_timeout = 5

; Connection Lifetimes
server_idle_timeout = 600
server_connect_timeout = 15
