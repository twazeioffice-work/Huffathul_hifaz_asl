# Location: apps/production-sre/kubernetes/network-policy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-isolation-policy
  namespace: suffat-prod
spec:
  podSelector:
    matchLabels:
      app: core-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic ONLY from the Frontend Gateway (BFF pods) on port 8000
  - from:
    - podSelector:
        matchLabels:
          app: internal-erp-frontend
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Limit egress strictly to the PgBouncer pods and local Memorystore Redis
  - to:
    - podSelector:
        matchLabels:
          app: pgbouncer
    ports:
    - protocol: TCP
      port: 6432
  - to:
    - podSelector:
        matchLabels:
          app: redis-cache
    ports:
    - protocol: TCP
      port: 6379
