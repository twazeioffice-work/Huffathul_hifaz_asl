[project]
name = "ai-swarm-mcp"
version = "0.1.0"
description = "MCP Vector Server for Autonomous Agent Swarm"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "mcp>=1.2.0",
    "chromadb>=0.5.0",
    "tree-sitter>=0.22.3",
    "sentence-transformers>=3.0.1",
    "pydantic>=2.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
