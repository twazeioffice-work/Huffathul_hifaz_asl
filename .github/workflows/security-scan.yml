name: Enterprise Security & Vulnerability Scan (Trivy + NPM Audit)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Run weekly on Mondays at 4:00 AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: NPM & Python Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: suffat-ul-huffaz-ecosystem/apps/internal-erp/package.json

      - name: Audit Node.js Production Dependencies
        run: |
          cd suffat-ul-huffaz-ecosystem/apps/internal-erp
          npm audit --omit=dev || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Safety Scanner & Check Python Dependencies
        run: |
          pip install pip-audit
          cd suffat-ul-huffaz-ecosystem/services/core-backend
          pip-audit || true

  trivy-fs-scan:
    name: Trivy Container & Repository Vulnerability Scan
    runs-on: ubuntu-latest
    needs: dependency-audit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo & Configs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Scan Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
